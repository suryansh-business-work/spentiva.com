appId: com.spentiva.mobile
---

# E2E Test: Forgot Password Flow
# Tests password reset request

- launchApp:
    clearState: true

# Navigate to forgot password
- assertVisible: "Welcome Back"
- tapOn: "Forgot Password?"

# Verify forgot password screen
- assertVisible: "Reset Password"
- assertVisible: "Enter your email to receive a reset link"

# Test 1: Submit empty email
- tapOn: "Send Reset Link"
- assertVisible: "Email is required"

# Test 2: Enter invalid email
- tapOn: "Email"
- inputText: "invalid"
- tapOn: "Send Reset Link"
- assertVisible: "Invalid email"

# Test 3: Enter valid email
- tapOn: "Email"
- clearText
- inputText: "test@spentiva.com"
- tapOn: "Send Reset Link"

# Should show success message
- extendedWaitUntil:
    visible: "If an account exists, a reset link has been sent."
    timeout: 10000

# Test 4: Navigate back to login
- tapOn: "Back to Sign In"
- assertVisible: "Welcome Back"
